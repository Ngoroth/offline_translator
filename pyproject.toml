[project]
name = "offline-translator"
version = "0.1.0"
description = "Async Offline Speech-to-Speech Translator (RPi 5)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.1",
    "pydantic>=2.0.0",
    "pynput>=1.8.1",
    "pyyaml>=6.0",
    "sounddevice>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",    # Async testing
    "ruff>=0.1.0",
    "basedpyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
