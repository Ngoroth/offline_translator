[project]
name = "offline-translator"
version = "0.1.0"
description = "Async Offline Speech-to-Speech Translator (RPi 5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "llama-cpp-python>=0.3.8",
    "loguru>=0.7.3",
    "numpy>=2.4.1",
    "piper-tts>=1.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.12.0",
    "pynput>=1.8.1",
    "pyyaml>=6.0",
    "sounddevice>=0.5.3",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",    # Async testing
    "ruff>=0.1.0",
    "basedpyright>=1.1.0",
    "huggingface-hub>=0.20.0",   # Model downloads in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
reportMissingTypeStubs = false
stubPath = "typings"
extraPaths = ["."]
# Global strictness (will be inherited by src)
reportAny = "error"
reportExplicitAny = "error"
reportUnusedCallResult = "error"
# Relaxed for 3rd party libs without types
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingModuleSource = "none"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportAny = "none"
reportExplicitAny = "none"
reportUnusedCallResult = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportPrivateUsage = "none"
reportMissingParameterType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src/typings"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src"
# Inherits global strictness

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: Quick initialization tests (mocked models)",
    "integration: Service wiring tests (mocked inference)",
    "e2e: Full pipeline with real models (requires downloads)",
    "benchmark: Performance tests (NFR validation)",
    "slow: Tests taking > 30s",
]
