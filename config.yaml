# Neuromancer Pi Configuration

# Select the active profile: "desktop_rtx4070" or "rpi_deployment"
current_profile: "rpi_deployment"

profiles:
  desktop_rtx4070:
    platform: "windows"
    input_mode: "keyboard"
    
    audio:
      sample_rate: 16000
      channels: 1
      playback_during_recording: false
    
    stt:
      model_path: "small"
      language: "en"
      beam_size: 5

    llm:
      model_path: "models/llm/Qwen3.5-4B-Q4_K_M.gguf"
      n_gpu_layers: -1
      context_window: 4096
      n_threads: 8
      seed: 1

    tts:
      model_path: "models/tts/en_US-libritts_r-medium.onnx"
    
    vad:
      threshold_ms: 500
      aggressiveness: 3

    # Dual Speaker Settings (single source of truth)
    speakers:
      a:
        key: "space"
        name: "Speaker A"
        from_lang: "en"
        to_lang: "ru"
        tts_model: "models/tts/ru_RU-denis-medium.onnx"
      b:
        key: "alt"
        name: "Speaker B"
        from_lang: "ru"
        to_lang: "en"
        tts_model: "models/tts/en_US-libritts_r-medium.onnx"

  rpi_deployment:
    platform: "rpi"
    input_mode: "evdev"
    
    audio:
      sample_rate: 16000
      channels: 1
      playback_during_recording: false
      # Use ALSA device names for Raspberry Pi
      input_device: "plughw:1,0"  # USB microphone (accepted by arecord native recorder)
      output_device: "default"  # 3.5mm jack (bcm2835) - must be a name PortAudio knows
    
    stt:
      model_path: "tiny"
      language: "en"
      beam_size: 1

    llm:
      # Using smaller 0.8B model for faster inference on Raspberry Pi (~500MB vs 1.2GB)
      model_path: "models/llm/Qwen3.5-0.8B-Q4_K_M.gguf"
      n_gpu_layers: 0
      context_window: 512  # Reduced for faster inference (translation doesn't need large context)
      n_threads: 4  # Measured optimal on Pi 4 (4 cores, memory-bound)
      seed: 1  # Fixed decoding for reproducible translations

    tts:
      model_path: "models/tts/en_US-libritts_r-medium.onnx"
      
    vad:
      threshold_ms: 500
      aggressiveness: 3
      auto_harvest: false  # Disabled for Pi - only process on PTT release to reduce LLM calls

    # GPIO Configuration for Raspberry Pi (backup option)
    gpio:
      chip_id: 0
      pin_a: 17  # GPIO17 - Speaker A button
      pin_b: 27  # GPIO27 - Speaker B button
      debounce_ms: 50
      active_low: true

    # Evdev Configuration for USB Numpad
    evdev:
      device_path: "/dev/input/by-id/usb-SIGMACHIP_USB_Keyboard-event-kbd"
      device_name: "SIGMACHIP USB Keyboard"

    # Dual Speaker Settings (single source of truth)
    speakers:
      a:
        key: "KEY_KP5"  # Numpad 5
        name: "Speaker A"
        from_lang: "en"
        to_lang: "ru"
        tts_model: "models/tts/ru_RU-denis-medium.onnx"  # Target language voice
      b:
        key: "KEY_KP6"  # Numpad 6
        name: "Speaker B"
        from_lang: "ru"
        to_lang: "en"
        tts_model: "models/tts/en_US-libritts_r-medium.onnx"  # Target language voice
