# Neuromancer Pi Configuration

# Select the active profile: "desktop_rtx4070" or "rpi_deployment"
current_profile: "rpi_deployment"

profiles:
  desktop_rtx4070:
    platform: "windows"
    input_mode: "keyboard"
    
    audio:
      sample_rate: 16000
      channels: 1
      playback_during_recording: false
    
    stt:
      model_path: "small"
      language: "en"
      beam_size: 5

    llm:
      model_path: "models/llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
      n_gpu_layers: -1
      n_ctx: 4096
      thread_count: 8

    tts:
      model_path: "models/tts/en_US-libritts_r-medium.onnx"
    
    vad:
      threshold_ms: 500
      aggressiveness: 3

    # Dual Speaker Settings (New Format)
    speaker_a_key: "space"
    speaker_b_key: "alt"
    speaker_a_voice: "models/tts/en_US-libritts_r-medium.onnx"
    speaker_b_voice: "models/tts/ru_RU-denis-medium.onnx"

    input:
      ptt_a: "space"
      ptt_b: "alt"

    speakers:
      a:
        name: "Speaker A"
        from_lang: "English"
        to_lang: "Russian"
        tts_model: "models/tts/ru_RU-denis-medium.onnx"
      b:
        name: "Speaker B"
        from_lang: "Russian"
        to_lang: "English"
        tts_model: "models/tts/en_US-libritts_r-medium.onnx"

  rpi_deployment:
    platform: "rpi"
    input_mode: "evdev"
    
    audio:
      sample_rate: 16000
      channels: 1
      playback_during_recording: false
      # Use ALSA device names for Raspberry Pi
      input_device: "plughw:1,0"  # USB microphone
      output_device: "plughw:0,0"  # Built-in audio or USB speakers
    
    stt:
      model_path: "tiny"
      language: "en"
      beam_size: 1

    llm:
      # Using smaller 0.6B model for faster inference on Raspberry Pi (~400MB vs 1.2GB)
      model_path: "models/llm/Qwen3-0.6B-Q8_0.gguf"
      n_gpu_layers: 0
      n_ctx: 512  # Reduced for faster inference (translation doesn't need large context)
      thread_count: 8  # Use all available threads on Pi 4 (4 cores * 2 threads)

    tts:
      model_path: "models/tts/en_US-libritts_r-medium.onnx"
      
    vad:
      threshold_ms: 500
      aggressiveness: 3
      auto_harvest: false  # Disabled for Pi - only process on PTT release to reduce LLM calls

    # GPIO Configuration for Raspberry Pi (backup option)
    gpio:
      chip_id: 0
      pin_a: 17  # GPIO17 - Speaker A button
      pin_b: 27  # GPIO27 - Speaker B button
      debounce_ms: 50
      active_low: true

    # Evdev Configuration for USB Numpad
    evdev:
      device_path: "/dev/input/event1"
      device_name: "SIGMACHIP USB Keyboard"

    # Dual Speaker Settings
    speaker_a_key: "KEY_KP5"  # Numpad 5
    speaker_b_key: "KEY_KP6"  # Numpad 6
    speaker_a_voice: "models/tts/ru_RU-denis-medium.onnx"  # Target language voice
    speaker_b_voice: "models/tts/en_US-libritts_r-medium.onnx"  # Target language voice

    input:
      ptt_a: "kp5"
      ptt_b: "kp6"

    speakers:
      a:
        name: "Speaker A"
        from_lang: "English"
        to_lang: "Russian"
        tts_model: "models/tts/ru_RU-denis-medium.onnx"
      b:
        name: "Speaker B"
        from_lang: "Russian"
        to_lang: "English"
        tts_model: "models/tts/en_US-libritts_r-medium.onnx"
