# Neuromancer Pi Configuration

# Select the active profile: "desktop_rtx4070" or "rpi_deployment"
current_profile: "desktop_rtx4070"

profiles:
  desktop_rtx4070:
    hardware:
      platform: "windows"
      input_mode: "keyboard"
    llm:
      # Adjust path to where you store your models
      model_path: "models/qwen2.5-14b-instruct-q4_k_m.gguf"
      n_gpu_layers: -1 # Offload all to GPU
      n_ctx: 4096

  rpi_deployment:
    hardware:
      platform: "rpi"
      input_mode: "gpio"
    llm:
      model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
      n_gpu_layers: 0 # CPU only
      n_ctx: 2048
